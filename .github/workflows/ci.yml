name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # The ubuntu job keeps the plain name: release-button.yml gates on check names.
    name: ${{ matrix.os == 'ubuntu-latest' && 'Typecheck & Test' || 'Typecheck & Test (macOS)' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: QA smoke
        if: matrix.os == 'ubuntu-latest'
        run: bun run qa:smoke

  hermes:
    name: Hermes plugin (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - name: Pytest
        working-directory: hermes
        run: |
          export HERMES_HOME="$(mktemp -d)"
          PYTHONPATH="$PWD/ci-stub" python -m pytest -q openltm_hermes
