<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(23,16,46,1)"/>
      <stop offset="1" stop-color="rgba(10,9,22,1)"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(251,191,36,1)"/>
      <stop offset="1" stop-color="rgba(232,121,249,1)"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.45" stop-color="rgba(251,191,36,1)"/>
      <stop offset="1" stop-color="rgba(232,121,249,1)"/>
    </radialGradient>
    <radialGradient id="hazeA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(251,191,36,0.3)"/>
      <stop offset="1" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
    <radialGradient id="hazeB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(232,121,249,0.28)"/>
      <stop offset="1" stop-color="rgba(232,121,249,0)"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="soft2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <!-- Everything is clipped to the rounded square so the ambient haze cannot
         leak past the corners (which produced bright wedges in v1). -->
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
